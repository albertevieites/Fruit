[tool.poetry]
name = "fruit quality"
version = "0.1.2"
description = "Fruit quality pedricition by regression"
authors = ["Alberte Vieites <albertevieites@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "2.5.0"
pandas = "2.3.3"
matplotlib = "3.9.0"
seaborn = "0.13.2"
scikit-learn = "1.9.0"
jupyter = "^1.0.0"
openpyxl = "3.1.0"
ipykernel = "6.31.0"
statsmodels = "0.14.6"
xgboost = "2.1.4"
notebook = "7.6.0"
# tensorflow = "^2.14.0"  # Temporalmente comentado debido a problemas de compatibilidad con Python 3.12


[tool.poetry.group.dev.dependencies]
klib = "^1.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
